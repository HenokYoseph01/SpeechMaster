name: speech_coach
description: "Local-first speech and presentation practice."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: 2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  intl: 0.20.3
  just_audio: 0.10.6
  path_provider: 2.1.6
  record: 7.1.2
  sherpa_onnx: 1.13.8
  sqlite3: 3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio_config.json
    - assets/models/silero_vad.onnx
    - assets/models/SILERO_LICENSE
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
